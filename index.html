<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apollo</title>
    <link rel="stylesheet" href="apollo.css">
    <link rel="icon" href="apollo_icon.png" type="image/png">
    <script src="toggle_theme.js" defer></script>
    <script src="canvas.js" defer></script>

  </head>
  <body>

    <canvas id="test">Uhm sorry!....An error occured while loading the canvas.</canvas>
    <menu id="top_buttons">
    <!--Top panel of basic tools' buttons-->
    <button id="draw_rectangle" type="button" class="tools"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"  stroke-width="1" stroke-linecap="butt" stroke-linejoin="round"><rect width="20" height="12" x="2" y="6" rx="2"/></svg></button>
    <button id="draw_circle" type="button" class="tools"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" stroke-width="1" stroke-linecap="butt" stroke-linejoin="round" ><circle cx="12" cy="12" r="10"/></svg></button>
    <button id="line" type="button" class="tools"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" stroke-width="1" stroke-linecap="butt" stroke-linejoin="round" ><path d="M5 12h14"/></svg></button>

    <button id="image" type="button" class="tools"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" stroke-width="1" stroke-linecap="butt" stroke-linejoin="round" ><rect width="18" height="18" x="3" y="3" rx="2" ry="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21"/></svg></button>
    <button id="pencil" type="button" class="tools"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" stroke-width="1" stroke-linecap="butt" stroke-linejoin="round" ><path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"/></svg></button>
    <button id="eraser" type="button" class="tools"><svg xmlns="http://www.w3.org/2000/svg"  viewBox="0 0 24 24" stroke-width="1" stroke-linecap="butt" stroke-linejoin="round"><path d="M21 21H8a2 2 0 0 1-1.42-.587l-3.994-3.999a2 2 0 0 1 0-2.828l10-10a2 2 0 0 1 2.829 0l5.999 6a2 2 0 0 1 0 2.828L12.834 21"/><path d="m5.082 11.09 8.828 8.828"/></svg></button>
    <button id="text" type="button" class="tools"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"  stroke-width="1" stroke-linecap="butt" stroke-linejoin="round" ><path d="M17 22h-1a4 4 0 0 1-4-4V6a4 4 0 0 1 4-4h1"/><path d="M7 22h1a4 4 0 0 0 4-4v-1"/><path d="M7 2h1a4 4 0 0 1 4 4v1"/></svg></button>
    <button id="selection" type="button" class="tools"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" stroke-width="1" stroke-linecap="butt" stroke-linejoin="round" ><path d="M12.586 12.586 19 19"/><path d="M3.688 3.037a.497.497 0 0 0-.651.651l6.5 15.999a.501.501 0 0 0 .947-.062l1.569-6.083a2 2 0 0 1 1.448-1.479l6.124-1.579a.5.5 0 0 0 .063-.947z"/></svg></button>
    
    </menu>
    <!--theme toggle button-->
    <button id="toggle_theme" class="extra_functionality" type="button">
      <svg xmlns="http://www.w3.org/2000/svg" id= "moon" viewBox="0 0 24 24" fill="white" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"><path d="M20.985 12.486a9 9 0 1 1-9.473-9.472c.405-.022.617.46.402.803a6 6 0 0 0 8.268 8.268c.344-.215.825-.004.803.401"/></svg>
      <svg xmlns="http://www.w3.org/2000/svg" id="sun" viewBox="0 0 24 24" fill="orange" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></svg> 
    </button>

    <div id="undo_redo" class="history">
    <button id="undo"  type="button">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 5.5 5.5a5.5 5.5 0 0 1-5.5 5.5H11"/></svg>
    </button>
    <button id="redo" type="button">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"><path d="m15 14 5-5-5-5"/><path d="M20 9H9.5A5.5 5.5 0 0 0 4 14.5A5.5 5.5 0 0 0 9.5 20H13"/></svg>
    </button>
    </div>
    <menu id="stroke_manipulation" class="beautifiers">
      <pre>Stroke color:</pre>
      <input type="color" id="stroke_color">
      <!--implement default color and local storage-->
      <pre>Stroke style:</pre>
      <div id="stroke_style">
        <button id="straight-line" type="button" class="stroke_button"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" stroke-width="1" stroke-linecap="butt" stroke-linejoin="round" ><path d="M5 12h14"/></svg></button>
        <button id="dotted-line" type="button" class="stroke_button"><svg xmlns="http://www.w3.org/2000/svg"  viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" ><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/><circle cx="5" cy="12" r="1"/></svg></button>
      </div>
      <pre>Stroke width:</pre>
      <div><input type="range" id="stroke_width" min="1" max="20" step="1"><span> </span><output id = "stroke_width_value" min_width="20px"></output></div>
      <pre>Opacity:</pre>
      <div><input type="range" id="opacity" min="0" max="100" step="1"><span> </span><output min-width = "20px" id = "opacity_value"></output></div>
    </menu>
    <menu id="font_manipulation" class="beautifiers">
      <pre>Text color:</pre>
      <input type="color" id="font_color">
      <pre>Font family:</pre>
      <select id="font_family">
        <option>Arial</option>
        <option>Consolas</option>
        <option>Helvetica</option>
        <option>Verdana</option>
        <option>Garamond</option>
        <option>Tahoma</option>
        <option>Impact</option>
      </select>
      <pre>Font size:</pre>
      <div><input type="range" id="font_size" min="0.5" max="6" step="0.0625"><span> </span><output min-width = "20px" id = "font_size_value"></output></div>
    </menu>
    
    
  </body>
</html>
